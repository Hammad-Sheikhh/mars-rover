name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | tar xz -C "$RUNNER_TEMP" gitleaks
      # Scans the full history (small repo), so force-pushes and rebases can't skip commits.
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  compile:
    name: Compile ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: rover1
            fqbn: esp32:esp32:esp32
          - sketch: cam1
            fqbn: esp32:esp32:esp32cam
    steps:
      - uses: actions/checkout@v5

      - name: Use placeholder credentials
        run: cp ${{ matrix.sketch }}/secrets.example.h ${{ matrix.sketch }}/secrets.h

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - ${{ matrix.sketch }}
          libraries: |
            - name: Adafruit BMP280 Library
            - name: Adafruit Unified Sensor
            - name: DHT sensor library
            - name: MPU6050_tockn
          enable-warnings-report: true
