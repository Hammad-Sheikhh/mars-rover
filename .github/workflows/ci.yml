name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | tar xz -C "$RUNNER_TEMP" gitleaks
      # Scans the full history (small repo), so force-pushes and rebases can't skip commits.
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  compile:
    name: Compile ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: rover1
            fqbn: esp32:esp32:esp32
          - sketch: cam1
            fqbn: esp32:esp32:esp32cam
    steps:
      - uses: actions/checkout@v5

      - name: Use placeholder credentials
        run: cp ${{ matrix.sketch }}/secrets.example.h ${{ matrix.sketch }}/secrets.h

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - ${{ matrix.sketch }}
          libraries: |
            - name: Adafruit BMP280 Library
            - name: Adafruit Unified Sensor
            - name: DHT sensor library
            - name: MPU6050_tockn
          enable-warnings-report: true

  earth-station:
    name: Earth Station (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Run the same one-command setup a teammate would, so a broken setup fails CI.
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1
      - name: Setup (macOS / Linux)
        if: runner.os != 'Windows'
        run: sh scripts/setup.sh

      - name: Lint
        shell: bash
        run: |
          PY=$([ "$RUNNER_OS" = "Windows" ] && echo .venv/Scripts/python || echo .venv/bin/python)
          $PY -m ruff check .
          $PY -m ruff format --check .
      - name: Tests
        shell: bash
        run: |
          PY=$([ "$RUNNER_OS" = "Windows" ] && echo .venv/Scripts/python || echo .venv/bin/python)
          $PY -m pytest -q
