name: Feature request
description: Propose a new capability for the rover, camera, or backend
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach (hardware, pins, data)
  - type: textarea
    id: impact
    attributes:
      label: Impact on security, power, or existing behaviour
